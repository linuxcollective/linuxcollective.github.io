<header id="article-header">
  <!-- Breadcrumbs -->
  <nav class="article-breadcrumbs" aria-label="Breadcrumb">
    <a href="/">Home</a>
    <span class="breadcrumb-separator">/</span>
    <a href="/docs/overview/">Documentation</a>
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-current">{{ .Title }}</span>
  </nav>

  <h1 class="article-title">{{ .Title | markdownify }}</h1>

  <div class="article-meta-bar">
    <span class="article-meta-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      {{ math.Round (div (countwords .Content) 180.0) | default 3 }} min read
    </span>
    <span class="article-meta-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      {{ countwords .Content }} words
    </span>
    {{ if .File }}
    <a href="https://github.com/linuxcollective/linuxcollective.github.io/edit/main/content/{{ .File.Path }}" target="_blank" rel="noopener noreferrer" class="article-edit-link">
      <i class="icon icon-github"></i>
      <span>Edit on GitHub</span>
    </a>
    {{ end }}
  </div>
</header>
